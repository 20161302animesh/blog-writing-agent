[project]
name = "blog-agent"
version = "0.1.0"
description = "LangGraph blog agent: technical posts and analysis/opinion pieces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain-core>=1.6,<2",
    "langchain-anthropic>=1.7,<2",
    "langchain-tavily>=0.2.18,<0.3",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[project.scripts]
blog-agent = "blog_agent.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["blog_agent", "blog_agent.pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
